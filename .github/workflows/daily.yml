name: Daily Universe Build

on:
  schedule:
    - cron: "0 6 * * 1-5"    # 06:00 UTC = 07:00 BST — early premarket pulse (2hr buffer for GH delay)
    - cron: "0 9 * * 1-5"    # 09:00 UTC = 10:00 BST — gap data building (2hr buffer)
    - cron: "0 10 * * 1-5"   # 10:00 UTC = 11:00 BST — main scan (2hr buffer, data reliable by 13:00 BST)
    - cron: "0 11 * * 1-5"   # 11:00 UTC = 12:00 BST — final check (2hr buffer, fresh before 13:30 entry)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run universe builder
        env:
          T212_API_KEY:    ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
        run: python universe.py

      - name: Send alert email (if strong candidates found)
        continue-on-error: true
        env:
          OUTLOOK_USER:     ${{ secrets.OUTLOOK_USER }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
          ALERT_EMAILS:     ${{ secrets.ALERT_EMAILS }}
        run: python send_alert.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/universe.csv
          git commit -m "Universe update [$(date -u '+%H:%M:%S UTC')]" || echo "Nothing to commit"
          git push
