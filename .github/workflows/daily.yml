name: Daily Universe Build

on:
  schedule:
    - cron: "0 8 * * 1-5"    # 08:00 UTC = 09:00 BST — early pulse
    - cron: "0 10 * * 1-5"   # 10:00 UTC = 11:00 BST — mid morning
    - cron: "0 12 * * 1-5"   # 12:00 UTC = 13:00 BST — KEY SCAN (peak premarket data, 1.5h before open)
    - cron: "0 13 * * 1-5"   # 13:00 UTC = 14:00 BST — final check before entry window
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run universe builder
        run: python universe.py

      - name: Send alert email (if strong candidates found)
        continue-on-error: true
        env:
          OUTLOOK_USER:     ${{ secrets.OUTLOOK_USER }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
          ALERT_EMAILS:     ${{ secrets.ALERT_EMAILS }}
        run: python send_alert.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/universe.csv
          git diff --staged --quiet || git commit -m "Universe update [$(date -u '+%H:%M:%S UTC')]"
          git push
