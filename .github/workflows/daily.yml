name: Daily Universe Build

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 11:00 UTC = 12:00 BST — morning scan
    - cron: "0 12 * * 1-5"   # 12:00 UTC = 13:00 BST — re-score + alert check
    - cron: "0 13 * * 1-5"   # 13:00 UTC = 14:00 BST — final check before open
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run universe builder
        run: python universe.py

      - name: Send alert email (if strong candidates found)
        env:
          OUTLOOK_USER:     ${{ secrets.OUTLOOK_USER }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
          ALERT_EMAILS:     ${{ secrets.ALERT_EMAILS }}
        run: python send_alert.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/universe.csv
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Daily universe update"
          git push
