name: Daily Universe Build

# 23 Aug 2026 — alert credentials switched from Outlook (basic auth blocked,
# alerts silently dead) to Gmail. GMAIL_USER + GMAIL_APP_PASSWORD secrets must
# exist in THIS repo too (secrets are per-repo). send_alert.py needs its env
# names updated to match — see PATCH_GUIDE.md step 6.

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 11:00 UTC = 12:00 BST — premarket opening
    - cron: "0 12 * * 1-5"   # 12:00 UTC = 13:00 BST — LIVE premarket (main scan)
    - cron: "0 13 * * 1-5"   # 13:00 UTC = 14:00 BST — final before entry window
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run universe builder
        env:
          T212_API_KEY:    ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
        run: python universe.py

      - name: Send alert email (if strong candidates found)
        continue-on-error: true
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAILS:       ${{ secrets.ALERT_EMAILS }}
        run: python send_alert.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/universe.csv output/premarket_*.csv
          git commit -m "Universe update [$(date -u '+%H:%M:%S UTC')]" || echo "Nothing to commit"
          git pull --rebase --no-edit origin main
          git push
